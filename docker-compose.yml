name: fonsat-local
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fonsat
      POSTGRES_PASSWORD: fonsat_local_password
      POSTGRES_DB: fonsat_db
    volumes:
      - app_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fonsat -d fonsat_db"]
      interval: 2s
      timeout: 3s
      retries: 30
  initialize:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://fonsat:fonsat_local_password@postgres:5432/fonsat_db?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    command: ["node", "docker/initialize.mjs"]
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://fonsat:fonsat_local_password@postgres:5432/fonsat_db?schema=public
      PORT: "3001"
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3001"
    depends_on:
      initialize:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/users/personas').then(response => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(response => { if (!response.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
volumes:
  app_database:
