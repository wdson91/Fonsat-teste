services:
  postgres:
    image: postgres:16-alpine
    container_name: fonsat_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fonsat
      POSTGRES_PASSWORD: fonsat_password
      POSTGRES_DB: fonsat_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fonsat -d fonsat_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

